<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoDrinks - Motor Inteligente de Mixologia</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>

    <div class="language-selector">
        <button id="btn-pt" class="lang-btn active">PT-BR</button>
        <button id="btn-en" class="lang-btn">EN-US</button>
    </div>

    <div class="container">
        <header class="hero-section">
            <h1 id="titleText">NeoDrinks</h1>
            <p class="subtitle" id="subtitleText">O que temos no bar hoje? Digite seus ingredientes e descubra o seu próximo drink.</p>
        </header>

        <main>
            <section class="search-section">
                <div class="search-wrapper">
                    <div id="tagsContainer" class="tags-container">
                        <!-- Tags aparecerão aqui -->
                        <input type="text" id="ingredientInput" placeholder="Ex: Limão Siciliano, Curaçao Blue, Água com gás (aperte Enter ou vírgula)" autocomplete="off" list="ingredientsDatalist">
                        <datalist id="ingredientsDatalist"></datalist>
                    </div>
                </div>
            </section>

            <section id="resultsSection" class="results-section hidden">
                <div id="recipesContainer" class="recipes-grid">
                    <!-- Receitas sugeridas aparecerão aqui -->
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
